name: Restore Azure Sync UI

on:
  push:
    branches: [fix/restore-azure-sync-selector]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restaurar formulario de sincronización
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          marker='# ========================================================\n# SINCRONIZACIÓN CON TEST PLAN / SUITE — ESCRITURA CONTROLADA\n# ========================================================'
          if marker not in s:
              raise SystemExit('No se encontró el bloque de sincronización actual')
          new_block=r'''# ========================================================
# SINCRONIZACIÓN CON TEST PLAN / SUITE — ESCRITURA CONTROLADA
# ========================================================
if st.session_state.get("result_json"):
    st.subheader("🔄 Sincronizar CP con Test Plan / Suite")
    st.caption("Selecciona el destino y define si deseas sincronizar un solo CP, algunos CP o todos los CP generados.")

    sync_plans = st.session_state.get("azure_reference_plans", [])
    if not sync_plans:
        st.info("Consulta primero los Test Plans para habilitar la sincronización.")
    else:
        plan_options = [
            f"{_ui_text(p.get('id'), 'SIN ID')} — {_ui_text(p.get('name'), 'Test Plan sin nombre')}"
            for p in sync_plans
        ]
        sync_plan_label = st.selectbox("1️⃣ Test Plan destino", plan_options, key="azure_sync_plan_select")
        sync_plan_id = sync_plans[plan_options.index(sync_plan_label)].get("id")

        sync_suites = st.session_state.get("azure_reference_suites", [])
        if st.session_state.get("azure_reference_plan_id") != sync_plan_id:
            st.warning("Consulta las Suites del Test Plan seleccionado para habilitar el destino.")
        elif not sync_suites:
            st.info("Consulta las Suites del Test Plan seleccionado.")
        else:
            suite_options = [
                f"{_ui_text(x.get('id'), 'SIN ID')} — {_ui_text(x.get('name'), 'Suite sin nombre')}"
                for x in sync_suites
            ]
            sync_suite_label = st.selectbox("2️⃣ Suite destino", suite_options, key="azure_sync_suite_select")
            sync_suite_id = sync_suites[suite_options.index(sync_suite_label)].get("id")

            sync_cases = st.session_state.result_json.get("TEST_CASES", []) or []
            if not sync_cases:
                st.warning("No hay CP generados para sincronizar.")
            else:
                sync_labels = [
                    f"{safe_text(tc.get('ID'), f'CP-{i+1:05d}')} — {build_case_title(tc, safe_text(tc.get('ID'), 'CP'))[:110]}"
                    for i, tc in enumerate(sync_cases)
                ]

                sync_mode = st.radio(
                    "3️⃣ ¿Qué CP deseas sincronizar?",
                    ["Un solo CP", "Algunos CP", "Todos los CP"],
                    horizontal=True,
                    key="azure_sync_mode",
                )

                if sync_mode == "Un solo CP":
                    one_label = st.selectbox("Selecciona el CP", sync_labels, key="azure_sync_one")
                    selected_sync_indexes = [sync_labels.index(one_label)]
                elif sync_mode == "Algunos CP":
                    selected_sync_labels = st.multiselect(
                        "Selecciona los CP a sincronizar",
                        sync_labels,
                        key="azure_sync_some",
                    )
                    selected_sync_indexes = [sync_labels.index(x) for x in selected_sync_labels]
                else:
                    selected_sync_indexes = list(range(len(sync_cases)))
                    st.info(f"Se sincronizarán los {len(selected_sync_indexes)} CP generados.")

                st.markdown("**4️⃣ Destino de sincronización**")
                st.write(f"Test Plan: **{_ui_text(sync_plan_label)}**")
                st.write(f"Suite: **{_ui_text(sync_suite_label)}**")
                st.caption(f"Parent ID de los CP: {sync_suite_id}. Related Work se conserva según el CU relacionado de cada CP.")

                confirm_sync = st.checkbox(
                    "Confirmo que deseo crear estos CP en Azure DevOps y asociarlos a la Suite seleccionada.",
                    key="azure_sync_confirm",
                )
                if st.button(
                    "🚀 Sincronizar CP con Test Plan / Suite",
                    type="primary",
                    disabled=(not confirm_sync or not selected_sync_indexes),
                    key="azure_sync_cases",
                ):
                    try:
                        with st.spinner("Creando Test Cases y asociándolos a la Suite seleccionada..."):
                            synced = sync_cases_to_test_suite(
                                st.session_state.result_json,
                                sync_plan_id,
                                sync_suite_id,
                                selected_sync_indexes,
                            )
                        st.success(f"✅ {len(synced)} CP sincronizados correctamente con la Suite seleccionada.")
                        st.dataframe(pd.DataFrame(synced), width="stretch", hide_index=True)
                    except AzureDevOpsError as exc:
                        st.error(f"❌ No se pudieron sincronizar los CP: {exc}")
                    except Exception as exc:
                        st.error(f"❌ Error inesperado durante la sincronización: {exc}")
'''
          s=s[:s.index(marker)]+new_block+'\n'
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit ajuste y eliminar workflow temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Restaurar selector un algunos todos para sincronizacion Azure" || true
          git rm .github/workflows/restore-azure-sync-ui.yml || true
          git commit -m "Eliminar workflow temporal de reparación Azure" || true
          git push
